name: Main Workflow

# use fields.git-main-branch to change from master
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  # manual run in actions tab - for all branches
  workflow_dispatch:

# Cancel runs upon PR updates:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - 4.14.2
        skip_test:
          - false
        build_vsix:
          - true


    runs-on: ${{ matrix.os }}

    # use fields.github-workflow-env to add something here

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set git user
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions-bot@users.noreply.github.com

      - name: Run apt update
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: avsm/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-pin: false

      - name: Retrieve cache of local opam switch
        uses: actions/cache/restore@v5
        id: cache-opam
        with:
          path: _opam
          key: v5-${{ runner.os }}-${{ matrix.ocaml-compiler }}-superbol-studio-oss-${{ hashFiles('**/*.opam', '.github/workflows/workflow.yml') }}-skip_tests=${{ matrix.skip_test }}-repo=

      # use fields.opam-repo = "git+https://" to add an 'extra' opam repository

      # Use fields.github-workflow-before-build to add something here
      - run: git submodule init

      - run: git submodule update

      - name: Prepare installation of GnuCOBOL 4.x
        id: gnucobol4
        run: |
          if ${{ matrix.os == 'ubuntu-latest' }}; then
            sudo apt-get install -y autoconf automake autopoint flex bison help2man texinfo wget libgmp-dev libdb-dev
          elif ${{ matrix.os == 'macos-latest' }}; then
            brew update
            brew install autoconf automake libtool bison help2man texinfo berkeley-db@5 json-c libiconv
          fi
          echo "commit=$(git -C import/gnucobol4 rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "image=${ImageOS:-unknown}-$(uname -m)" >> $GITHUB_OUTPUT
          echo "$HOME/gnucobol-4.x/bin" >> $GITHUB_PATH
          echo "GNUCOBOL4_COB_CONFIG=$HOME/gnucobol-4.x/bin/cob-config" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/gnucobol-4.x/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo 'HAVE_LIBCOB5=true' >> $GITHUB_ENV
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest' }}

      - name: Retrieve cache of GnuCOBOL 4.x
        uses: actions/cache/restore@v5
        id: cache-gnucobol4
        with:
          path: ~/gnucobol-4.x
          key: gnucobol-4.x-${{ steps.gnucobol4.outputs.image }}-${{ steps.gnucobol4.outputs.commit }}-${{ hashFiles('scripts/install-gnucobol.sh') }}
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest' }}

      - name: Build and install GnuCOBOL 4.x
        run: |
          if ${{ matrix.os == 'macos-latest' }}; then
            HOMEBREW_ROOT="$(brew --prefix)/opt"
            export TERM=vt100
            export PATH="$HOMEBREW_ROOT/bison/bin:${PATH}"
            export LDFLAGS="-L$HOMEBREW_ROOT/berkeley-db@5/lib -L$HOMEBREW_ROOT/libiconv/lib ${LDFLAGS}"
            export CPPFLAGS="-I$HOMEBREW_ROOT/berkeley-db@5/include -I$HOMEBREW_ROOT/libiconv/include ${CPPFLAGS}"
          fi
          bash scripts/install-gnucobol.sh import/gnucobol4 "$HOME/gnucobol-4.x"
        if: ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest') && steps.cache-gnucobol4.outputs.cache-hit != 'true' }}

      - name: Save cache of GnuCOBOL 4.x
        uses: actions/cache/save@v5
        with:
          path: ~/gnucobol-4.x
          key: ${{ steps.cache-gnucobol4.outputs.cache-primary-key }}
        if: ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest') && steps.cache-gnucobol4.outputs.cache-hit != 'true' }}

      - name: Skip build and install of GnuCOBOL 4.x
        run: |
          echo 'HAVE_LIBCOB5=false' >> $GITHUB_ENV
        if: ${{ matrix.os != 'ubuntu-latest' && matrix.os != 'macos-latest' }}

      # GnuCOBOL 3.x, for the debugger tests
      - name: Prepare installation of GnuCOBOL 3.x
        id: gnucobol3
        run: |
          sudo apt-get install -y autoconf automake autopoint flex bison help2man texinfo libgmp-dev libdb-dev gdb xvfb
          echo "commit=$(git -C import/gnucobol rev-parse HEAD)" >> $GITHUB_OUTPUT
          # Hardening makes cobc compile programs with -O, which breaks debugging
          echo "options=--disable-hardening" >> $GITHUB_OUTPUT
          echo "image=${ImageOS:-unknown}-$(uname -m)" >> $GITHUB_OUTPUT
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix }}

      - name: Retrieve cache of GnuCOBOL 3.x
        uses: actions/cache/restore@v5
        id: cache-gnucobol3
        with:
          path: ~/gnucobol-3.x
          key: gnucobol-3.x-${{ steps.gnucobol3.outputs.image }}-${{ steps.gnucobol3.outputs.commit }}-${{ hashFiles('scripts/install-gnucobol.sh') }}-${{ steps.gnucobol3.outputs.options }}
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix }}

      - name: Build and install GnuCOBOL 3.x
        run: bash scripts/install-gnucobol.sh import/gnucobol "$HOME/gnucobol-3.x" ${{ steps.gnucobol3.outputs.options }}
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix && steps.cache-gnucobol3.outputs.cache-hit != 'true' }}

      - name: Save cache of GnuCOBOL 3.x
        uses: actions/cache/save@v5
        with:
          path: ~/gnucobol-3.x
          key: ${{ steps.cache-gnucobol3.outputs.cache-primary-key }}
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix && steps.cache-gnucobol3.outputs.cache-hit != 'true' }}

      - name: Use GnuCOBOL 3.x
        run: |
          echo "$HOME/gnucobol-3.x/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$HOME/gnucobol-3.x/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix }}

      - uses: actions/setup-node@v7
        with:
          node-version: '>=22'
          cache: 'npm'
          cache-dependency-path: '**/package.json'
        if: matrix.build_vsix

      - run: make node-deps && npm list
        if: matrix.build_vsix

      - run: make build-deps
        id: build-deps
        if: ${{ steps.cache-opam.outputs.cache-hit != 'true' && matrix.skip_test }}

      - run: make dev-deps
        id: dev-deps
        if: ${{ steps.cache-opam.outputs.cache-hit != 'true' && ! matrix.skip_test }}

      # Use fields.build-scripts to add more scripts to convert here
      - run: dos2unix scripts/*.sh 
        if: matrix.os == 'windows-latest'

      # Use fields.github-workflow-before-build to add something here
      - name: Check project files
        run: |
          opam pin --yes "git+https://github.com/OCamlPro/drom.git#v0.9.3"
          make check-project
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - run: make build

      # Use fields.github-workflow-after-build to add something here
      - run: make check-package.json

      - run: make test
        if: ${{ ! matrix.skip_test }}

      # Use fields.github-workflow-after-test to add something here
      - name: Show test result on failure
        if: failure()
        run: cat _build/_autofonce/results.log

      - run: make vsix-debug
        if: matrix.build_vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: VSIX-${{ matrix.os }}
          path: superbol-vscode-oss-*.vsix
          compression-level: 0 # no compression (already a zip archive)
        if: matrix.build_vsix

      - run: make vsix-debug TARGET_PLAT=universal
        if: ${{ matrix.build_vsix && matrix.os == 'ubuntu-latest' }}

      - name: Upload universal VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: VSIX-universal
          path: superbol-vscode-oss-*-universal-*.vsix
          compression-level: 0 # no compression (already a zip archive)
        if: ${{ matrix.build_vsix && matrix.os == 'ubuntu-latest' }}

      # Tests of the LSP server compiled into JavaScript, as shipped in
      # universal VSIXs
      - run: make test-js
        if: ${{ matrix.build_vsix && matrix.os == 'ubuntu-latest' && ! matrix.skip_test }}

      # Debugger tests, run within VS Code with GnuCOBOL 3.x
      - name: Get the month for the cache of VS Code
        id: vscode-test
        run: echo "month=$(date +%Y-%m)" >> $GITHUB_OUTPUT
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix }}

      - name: Retrieve cache of VS Code and its extensions for tests
        uses: actions/cache/restore@v5
        id: vscode-test-cache
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ steps.vscode-test.outputs.month }}-${{ hashFiles('package.json') }}
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix }}

      - name: Run debugger tests
        id: debugger-tests
        run: xvfb-run -a make test-vscode-debug
        env:
          SUPERBOL_TEST_JOBS: 2
        # On master, failures must not prevent building and deploying documentation
        continue-on-error: ${{ github.ref == 'refs/heads/master' }}
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.build_vsix }}

      - name: Save cache of VS Code and its extensions for tests
        uses: actions/cache/save@v5
        with:
          path: .vscode-test
          key: ${{ steps.vscode-test-cache.outputs.cache-primary-key }}
        # Whether the tests passed or failed
        if: ${{ always() && steps.vscode-test-cache.outputs.cache-hit != 'true' && (steps.debugger-tests.outcome == 'success' || steps.debugger-tests.outcome == 'failure') }}

      # - name: Check whether source is well formatted
      #   run: make fmt
      #   continue-on-error: true
      #   if: matrix.ocaml-compiler == '4.14.2' && matrix.os == 'ubuntu-latest'

      - name: Build documentation
        if: github.ref == 'refs/heads/master' && matrix.ocaml-compiler == '4.14.2' && matrix.os == 'ubuntu-latest'
        run: |
             sudo apt install -yqq python3-sphinx python3-sphinx-rtd-theme
             opam install -y dune odoc
             make doc
             touch _drom/docs/.nojekyll
             touch _drom/docs/sphinx/.nojekyll
             touch _drom/docs/doc/.nojekyll

      - name: Deploy documentation
        uses: JamesIves/github-pages-deploy-action@3.6.2
        if: github.ref == 'refs/heads/master' && matrix.ocaml-compiler == '4.14.2' && matrix.os == 'ubuntu-latest'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: _drom/docs/
          CLEAN: true

# Use fields.github-workflow-trailer to add a trailer here


      - name: Cleanup local opam switch before caching
        run: |
          opam pin remove . --yes || true
          opam clean --switch-cleanup --logs
          find _opam -type f -a \( -name '*.cmt' -o -name '*.cmti' \) -delete
        # Even when a later step failed, as long as dependencies are installed
        if: ${{ always() && steps.cache-opam.outputs.cache-hit != 'true' && (steps.build-deps.outcome == 'success' || steps.dev-deps.outcome == 'success') }}

      - name: Save cache of local opam switch
        uses: actions/cache/save@v5
        with:
          path: _opam
          key: ${{ steps.cache-opam.outputs.cache-primary-key }}
        if: ${{ always() && steps.cache-opam.outputs.cache-hit != 'true' && (steps.build-deps.outcome == 'success' || steps.dev-deps.outcome == 'success') }}
