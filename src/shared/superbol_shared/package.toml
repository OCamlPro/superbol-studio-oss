
# name of package
name = "superbol_shared"
skeleton = "library"

# synopsis if different from project synopsis
synopsis = "Information shared between the SuperBOL tools and the VS Code extension"

# description if different from project description
description = "Dependency-free definitions (e.g, COBOL file extensions) that both native and JavaScript components of SuperBOL Studio rely on"

# kind is either "library", "program" or "virtual"
kind = "library"

# files to skip while updating at package level
skip = ["index.mld", "main.ml"]

# package library dependencies
[dependencies]

# package tools dependencies
[tools]

# package fields (depends on package skeleton)
[fields]
